<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rlisp-engine — песочница (WASM)</title>
<style>
  :root { --bg:#10141c; --panel:#161c28; --edge:#232c3d; --ink:#cfd8e6; --dim:#7c8aa0;
          --acc:#5ad1a0; --acc2:#6aa8ff; --warn:#ff9d6a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 "JetBrains Mono","Fira Mono",Consolas,monospace; }
  header { display:flex; align-items:baseline; gap:14px; padding:10px 16px;
           border-bottom:1px solid var(--edge); }
  header h1 { font-size:16px; margin:0; color:var(--acc); }
  header .sub { color:var(--dim); font-size:12px; }
  header a { color:var(--acc2); text-decoration:none; font-size:12px; margin-left:auto; }
  main { display:flex; gap:12px; padding:12px 16px; align-items:stretch; }
  #left { flex:1 1 46%; min-width:340px; display:flex; flex-direction:column; gap:8px; }
  #right { flex:1 1 54%; min-width:420px; display:flex; flex-direction:column; gap:8px; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  select, button, input { background:var(--panel); color:var(--ink); border:1px solid var(--edge);
         border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover, select:hover { border-color:var(--acc); }
  button.primary { background:#1d3a30; border-color:var(--acc); color:var(--acc); }
  textarea { flex:1; width:100%; min-height:380px; resize:vertical;
             background:var(--panel); color:var(--ink); border:1px solid var(--edge);
             border-radius:8px; padding:10px; font:12.5px/1.5 inherit; white-space:pre; }
  textarea:focus { outline:1px solid var(--acc2); }
  #wrap { position:relative; line-height:0; }
  canvas { width:100%; max-width:720px; image-rendering:pixelated; border:1px solid var(--edge);
           border-radius:8px; background:#000; }
  #status { color:var(--dim); font-size:12px; }
  #console { background:#0b0e14; border:1px solid var(--edge); border-radius:8px;
             height:170px; overflow-y:auto; padding:8px 10px; font-size:12px; }
  #console .err { color:var(--warn); }
  #console .sys { color:var(--dim); }
  #console .out { color:var(--ink); }
  #console .res { color:var(--acc); }
  #replrow { display:flex; gap:8px; }
  #replin { flex:1; }
  .kbd { color:var(--dim); font-size:11px; }
  .kbd b { color:var(--ink); }
</style>
</head>
<body>
<header>
  <h1>rlisp-engine</h1>
  <span class="sub">интерпретатор + софт-рендер + физика — целиком в браузере, ноль сети после загрузки</span>
  <a href="https://github.com/kostyk348/rlisp-engine">репозиторий →</a>
</header>
<main>
  <section id="left">
    <div class="bar">
      <select id="preset"></select>
      <button id="run" class="primary">▶ Запустить</button>
      <button id="sound">🔊 звук</button>
      <button id="share" title="Ссылка со встроенной сценой: скопируется в буфер">🔗 Ссылка</button>
    </div>
    <textarea id="code" spellcheck="false"></textarea>
    <div id="replrow">
      <input id="replin" placeholder="REPL: живое выражение, Enter — выполнить (например (phys-n *phys*))">
      <button id="replgo">↵</button>
    </div>
  </section>
  <section id="right">
    <div id="wrap"><canvas id="screen" width="320" height="240"></canvas></div>
    <div class="bar">
      <span id="status">—</span>
      <span style="flex:1"></span>
      <button class="res" data-w="320" data-h="240">320×240</button>
      <button class="res" data-w="400" data-h="300">400×300</button>
      <button class="res" data-w="512" data-h="384">512×384</button>
      <button id="shot" title="Скачать текущий кадр PNG">📷 PNG</button>
    </div>
    <div id="console"></div>
    <div class="kbd">клавиши сцене: <b>A/D</b> — камера, <b>R</b> — пересыпать кокосы · фокус на канвасе</div>
  </section>
</main>
<script>
"use strict";
// ——— WASM (base64, инлайн) ————————————————————————————————————————
const WASM_B64 = "__WASM_B64__";

// ——— пресеты ———————————————————————————————————————————————————————
const PRESETS = {
"ШТОЛЬНЯ (хоррор: фонарь, монстр)": __PRESET_SHTOLNYA__,
"ОАЗИС (FPS: лисы, стрельба, волны)": __PRESET_OASIS__,
"Физполигон (3D, физика, вода)": __PRESET_PHYSPOLY__,
"Мячи и трамплин (мини-сцена)": __PRESET_BALLS__,
"Только 2D (шаблон)": __PRESET_2D__
};

// ——— утилиты ———————————————————————————————————————————————————————
const $ = (id) => document.getElementById(id);
const conEl = $("console");
function con(text, cls) {
  const d = document.createElement("div");
  d.className = cls || "out";
  d.textContent = text;
  conEl.appendChild(d);
  while (conEl.childNodes.length > 220) conEl.removeChild(conEl.firstChild);
  conEl.scrollTop = conEl.scrollHeight;
}

// ——— движок: свежий инстанс на каждый «Запустить» ————————————————————
let modulePromise = null;
let ex = null, S = 0, W = 320, H = 240;
const enc = new TextEncoder();

async function instantiate() {
  if (!modulePromise) {
    const bytes = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
    modulePromise = WebAssembly.compile(bytes);
  }
  const mod = await modulePromise;
  ex = (await WebAssembly.instantiate(mod, {})).exports;
}

function start(src) {
  S = 0;
  const bytes = enc.encode(src);
  const IN = ex.rl_scratch_in();
  new Uint8Array(ex.memory.buffer).set(bytes, IN);
  S = ex.rl_new(W, H);
  if (ex.rl_load(S, IN, bytes.length) !== 0) {
    const OUT = ex.rl_scratch_out();
    const n = ex.rl_last_err(0);
    con("ошибка загрузки: " + new TextDecoder().decode(new Uint8Array(ex.memory.buffer).subarray(OUT, OUT + n)), "err");
    return false;
  }
  return true;
}

// ——— звук: удары физики → WebAudio ——————————————————————————————————
let audioOn = true, actx = null, lastSounds = 0;
function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function beep(freq, dur, vol, type) {
  if (!audioOn) return;
  try {
    const a = ac(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.55), t + dur);
    g.gain.setValueAtTime(Math.min(0.5, vol), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* без звука */ }
}
let noiseBuf = null;
function splash(vol) {
  if (!audioOn) return;
  try {
    const a = ac();
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, a.sampleRate * 0.3, a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    s.buffer = noiseBuf;
    f.type = "lowpass"; f.frequency.value = 900;
    g.gain.value = Math.min(0.35, vol);
    s.connect(f).connect(g).connect(a.destination);
    s.start();
  } catch (e) { /* без звука */ }
}

// ——— главный цикл ———————————————————————————————————————————————————
let lastT = 0, frames = 0, fpsAcc = 0, fpsN = 0, fpsShown = 0;
const OUT = () => ex.rl_scratch_out();
const dec = new TextDecoder();
const img = new ImageData(W, H);

function loop(t) {
  requestAnimationFrame(loop);
  if (!S) { return; }
  const dt = lastT ? Math.min(0.05, Math.max(0.001, (t - lastT) / 1000)) : 1 / 60;
  lastT = t;
  if (ex.rl_frame(S, dt, t) !== 0) {
    const n = ex.rl_last_err(0);
    con("ошибка кадра: " + dec.decode(new Uint8Array(ex.memory.buffer).subarray(OUT(), OUT() + n)), "err");
    S = 0;
    return;
  }
  // кадр на экран: свежие view на память (buffer мог вырасти)
  const ptr = ex.rl_fb(S);
  const w = ex.rl_w(S), h = ex.rl_h(S);
  if (w !== img.width || h !== img.height) { img = new ImageData(w, h); $("screen").width = w; $("screen").height = h; }
  new Uint8ClampedArray(ex.memory.buffer).subarray(ptr, ptr + w * h * 4).forEach((v, i) => { });
  const src8 = new Uint8Array(ex.memory.buffer, ptr, w * h * 4);
  img.data.set(src8);
  const cx = $("screen").getContext("2d");
  cx.putImageData(img, 0, 0);

  // события физики → звук
  const nEv = ex.rl_take_events(S, 4096);
  if (nEv && audioOn && t - lastSounds > 30) {
    const ev = new Float32Array(ex.memory.buffer, OUT(), nEv);
    let made = 0;
    for (let i = 0; i + 5 < nEv && made < 4; i += 6) {
      const kind = ev[i + 1], speed = ev[i + 2], y = ev[i + 4];
      const v = Math.min(0.4, speed / 22);
      if (v < 0.02) continue;
      if (y < 0.25) splash(v);
      else if (kind === 0) beep(85 + speed * 14, 0.14, v, "sine");
      else beep(420 + speed * 30, 0.06, v, "triangle");
      made++;
    }
    if (made) lastSounds = t;
  }

  // вывод движка (print сцены) → консоль
  const nOut = ex.rl_take_output(0);
  if (nOut) {
    const text = dec.decode(new Uint8Array(ex.memory.buffer).subarray(OUT(), OUT() + nOut));
    text.split("\n").filter(s => s.length).forEach(l => con(l, "sys"));
  }

  // статус
  frames++; fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) {
    fpsShown = Math.round(fpsN / fpsAcc);
    fpsAcc = 0; fpsN = 0;
    $("status").textContent = `${fpsShown} fps · ${frames} кадров · ${w}×${h}`;
  }
}

// ——— клавиатура → движок ————————————————————————————————————————————
const keymap = { KeyA: "a", KeyD: "d", KeyW: "w", KeyS: "s", KeyR: "r", Space: " " };
function sendKey(e, down) {
  const k = keymap[e.code];
  if (!k || !S) return;
  e.preventDefault();
  const bytes = enc.encode(k);
  const IN = ex.rl_scratch_in();
  new Uint8Array(ex.memory.buffer).set(bytes, IN);
  ex.rl_key(S, IN, bytes.length, down ? 1 : 0);
  if (audioOn && actx === null) ac();
}
window.addEventListener("keydown", (e) => { if (e.target.tagName !== "TEXTAREA" && e.target.tagName !== "INPUT") sendKey(e, true); });
window.addEventListener("keyup", (e) => { if (e.target.tagName !== "TEXTAREA" && e.target.tagName !== "INPUT") sendKey(e, false); });

// ——— REPL ———————————————————————————————————————————————————————————
const hist = []; let histPos = -1;
function repl() {
  const inp = $("replin");
  const code = inp.value.trim();
  if (!code || !S) return;
  if (hist[hist.length - 1] !== code) hist.push(code);
  histPos = hist.length;
  con("> " + code, "sys");
  const bytes = enc.encode(code);
  const IN = ex.rl_scratch_in();
  new Uint8Array(ex.memory.buffer).set(bytes, IN);
  const rc = ex.rl_eval(S, IN, bytes.length);
  const OUTb = ex.rl_scratch_out();
  const n = ex.rl_last_err(0);
  const text = dec.decode(new Uint8Array(ex.memory.buffer).subarray(OUTb, OUTb + n));
  con(text, rc === 0 ? "res" : "err");
  inp.value = "";
}
$("replgo").addEventListener("click", repl);
$("replin").addEventListener("keydown", (e) => {
  if (e.key === "Enter") repl();
  else if (e.key === "ArrowUp" && histPos > 0) { histPos--; $("replin").value = hist[histPos]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { histPos = Math.min(hist.length, histPos + 1); $("replin").value = hist[histPos] || ""; e.preventDefault(); }
});

// ——— UI: пресеты, запуск, звук, разрешение ———————————————————————————
const presetSel = $("preset");
for (const name of Object.keys(PRESETS)) {
  const o = document.createElement("option");
  o.textContent = name; o.value = name;
  presetSel.appendChild(o);
}
presetSel.addEventListener("change", () => { $("code").value = PRESETS[presetSel.value]; run(); });
$("code").addEventListener("keydown", (e) => {
  if (e.key === "Tab") {
    e.preventDefault();
    const t = e.target, s = t.selectionStart;
    t.value = t.value.slice(0, s) + "  " + t.value.slice(t.selectionEnd);
    t.selectionStart = t.selectionEnd = s + 2;
  }
});
$("run").addEventListener("click", run);

// ——— экспорт кадра PNG ————————————————————————————————————————————————
$("shot").addEventListener("click", () => {
  const c = $("screen");
  c.toBlob((b) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "rlisp-playground-" + Date.now() + ".png";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    con("кадр сохранён: " + a.download, "sys");
  });
});

// ——— шаринг сцены через URL-хеш (#code=...) ————————————————————————
$("share").addEventListener("click", async () => {
  const url = location.href.split("#")[0] +
    "#code=" + encodeURIComponent($("code").value);
  history.replaceState(null, "", "#code=" + encodeURIComponent($("code").value));
  const kb = (url.length / 1024).toFixed(1);
  try {
    await navigator.clipboard.writeText(url);
    con("ссылка со сценой скопирована в буфер (" + kb + " КБ) — открой её: сцена загрузится сама", "sys");
  } catch (e) {
    con("ссылка со сценой готова в адресной строке (" + kb + " КБ)", "sys");
  }
});
function sceneFromHash() {
  const m = location.hash.match(/^#code=(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}
$("sound").addEventListener("click", () => {
  audioOn = !audioOn;
  $("sound").textContent = audioOn ? "🔊 звук" : "🔇 тихо";
  if (audioOn) ac();
});
document.querySelectorAll("button.res").forEach(b => b.addEventListener("click", () => {
  W = +b.dataset.w; H = +b.dataset.h;
  if (S) { ex.rl_resize(S, W, H); }
  run();
}));

let booting = false;
async function run() {
  if (booting) return;
  booting = true;
  try {
    await instantiate();
    S = 0; frames = 0; lastT = 0;
    conEl.innerHTML = "";
    con("запуск: " + presetSel.value, "sys");
    const t0 = performance.now();
    if (start($("code").value)) {
      con(`загружено за ${(performance.now() - t0).toFixed(0)} мс`, "sys");
    }
  } catch (e) {
    con("не удалось запустить движок: " + e, "err");
  }
  booting = false;
}

// ——— старт ———————————————————————————————————————————————————————————
(async () => {
  const fromLink = sceneFromHash();
  if (fromLink !== null) {
    $("code").value = fromLink;
    const o = document.createElement("option");
    o.textContent = "Сцена из ссылки"; o.value = "";
    presetSel.insertBefore(o, presetSel.firstChild);
    presetSel.value = "";
  } else {
    $("code").value = PRESETS[presetSel.value];
  }
  await instantiate();
  con("rlisp-engine в WebAssembly: интерпретатор Lisp, программный 3D-растеризатор, физика (сферы/heightfield), WASM " +
      Math.round(atob(WASM_B64).length / 1024) + " КБ", "sys");
  run();
  requestAnimationFrame(loop);
  // после очистки консоли при запуске — сообщение о сцене из ссылки
  if (fromLink !== null) {
    setTimeout(() => con("сцена загружена из ссылки — правь код и жми «Запустить»", "sys"), 400);
  }
})();
</script>
</body>
</html>
